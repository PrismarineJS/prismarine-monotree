name: Update Trees

on:
  workflow_dispatch:

jobs:
  update-trees:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - run: node scripts/create-trees.js

      - name: Run update-trees script
        run: node scripts/update-trees.js

      - name: Open a pull request for tree updates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-trees
          base: ${{ github.event.repository.default_branch }}
          title: 'chore: update trees'
          commit-message: 'chore: update trees'
          body: |
            Automated subtree updates. Review and merge through a pull request.
            If GitHub requests workflow approval, approve the CI runs before merging.
